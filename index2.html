<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clasificador de Perros y Gatos</title>

  <!-- Favicons (ya los tienes en el proyecto) -->
  <img src="img/perro50x50.png">
  <img src="img/gato50x50.png">


  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    body { background: #0f172a; color: #e5e7eb; }
    header { border-bottom: 1px solid #1f2937; }
    .brand-logo { width: 80px; height: 80px; object-fit: contain; }
    #canvas { max-width: 100%; border-radius: 12px; border: 1px solid #1f2937; }
    #resultado { font-weight: 800; font-size: clamp(2rem, 6vw, 4rem); text-align: center; margin-top: .5rem; }
    .badge-pulse { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% {opacity:.4} 50% {opacity:1} 100% {opacity:.4} }
    .footer { border-top: 1px solid #1f2937; }
    .prob-box { background:#0b1220; border:1px solid #1f2937; border-radius:12px; padding:12px; }
    .bar { height: 10px; border-radius: 999px; background:#111827; overflow:hidden }
    .bar > div { height:100%; width:0% }
  </style>
</head>
<body>

  <!-- Header / Hero -->
  <header class="py-3 text-center">
    <img src="img/garfield.png" alt="Logo" class="brand-logo d-block mx-auto mb-2" />
    <h1 class="fw-bold mb-1">Perros y Gatos</h1>
    <p class="text-secondary mb-2">Clasificador en el navegador con TensorFlow.js (cámara del celular)</p>
    <div class="d-flex gap-2 justify-content-center align-items-center mb-2">
      <span id="model-status" class="badge text-bg-warning badge-pulse">Cargando modelo…</span>
      <select id="model-select" class="form-select form-select-sm w-auto" onchange="cambiarModelo()">
        <!-- Ajusta estas rutas a tus carpetas exportadas -->
        <option value="web_model_cnn/model.json" selected>RegularNet</option>
        <option value="web_model_dense/model.json">CNN (opcional)</option>
      </select>
    </div>
    <small class="text-secondary">Sugerencia: usa <strong>https</strong> o <strong>localhost</strong> para permisos de cámara en móvil.</small>
  </header>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 text-center">
        <!-- Video oculto: solo sirve de fuente para canvas -->
        <video id="video" playsinline autoplay muted style="width:1px;height:1px;position:absolute;left:-9999px;"></video>

        <div class="d-grid gap-2 d-md-flex justify-content-md-center mb-3">
          <button id="btn-start" class="btn btn-primary" onclick="iniciar()">Iniciar cámara</button>
          <button class="btn btn-outline-light" onclick="cambiarCamara()">Cambiar cámara</button>
        </div>

        <canvas id="canvas" width="400" height="400"></canvas>

        <div id="resultado" class="mt-3">—</div>

        <div class="row g-3 mt-2">
          <div class="col-12 col-md-6">
            <div class="prob-box text-start">
              <div class="d-flex justify-content-between">
                <span>Perro</span><span id="prob-dog">0%</span>
              </div>
              <div class="bar mt-1"><div id="bar-dog" class="bg-primary"></div></div>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <div class="prob-box text-start">
              <div class="d-flex justify-content-between">
                <span>Gato</span><span id="prob-cat">0%</span>
              </div>
              <div class="bar mt-1"><div id="bar-cat" class="bg-success"></div></div>
            </div>
          </div>
        </div>

        <!-- Canvas pequeño para redimensionar si lo quieres usar -->
        <canvas id="tmp" width="100" height="100" style="display:none"></canvas>
      </div>
    </div>
  </main>

  <footer class="footer py-4 text-center">
    <img src="img/odie.png" alt="Marca" style="height:40px;object-fit:contain" class="mb-2" />
    <p class="text-secondary mb-0">
      Proyecto personalizado por <strong>Ana Laura Chenoweth Galaz</strong>. Inspirado en Ringa Tech.
    </p>
  </footer>

  <!-- Bootstrap JS -->
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- TensorFlow.js actualizado -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>



  <script>
    const tamano = 400;
    const inputSize = 100; // debe coincidir con tu entrenamiento (100x100x1)
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const tmp = document.getElementById('tmp');
    const modelSelect = document.getElementById('model-select');
    const modelStatus = document.getElementById('model-status');

    let currentStream = null;
    let facingMode = 'user'; // 'environment' para trasera
    let modelo = null;
    let corriendo = false;

    // ======== Carga de modelo =========
    async function cargarModelo(ruta) {
      try {
        modelStatus.textContent = 'Cargando modelo…';
        modelStatus.className = 'badge text-bg-warning badge-pulse';
        modelo = await tf.loadLayersModel(ruta);
        // Warmup
        tf.tidy(() => {
          const warm = tf.zeros([1, inputSize, inputSize, 1]);
          modelo.predict(warm);
        });
        modelStatus.textContent = 'Modelo listo';
        modelStatus.className = 'badge text-bg-success';
      } catch (e) {
        console.error(e);
        modelStatus.textContent = 'Error cargando modelo';
        modelStatus.className = 'badge text-bg-danger';
        alert('No se pudo cargar el modelo: ' + e.message);
      }
    }

    async function cambiarModelo() {
      const ruta = modelSelect.value;
      await cargarModelo(ruta);
    }

    // ======== Cámara =========
    async function iniciar() {
      try {
        if (currentStream) {
          currentStream.getTracks().forEach(t => t.stop());
        }
        const constraints = {
          audio: false,
          video: { width: tamano, height: tamano, facingMode }
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        await video.play();
        corriendo = true;
        loop();
      } catch (e) {
        console.error(e);
        alert('No se pudo utilizar la cámara. ' + e.message);
      }
    }

    async function cambiarCamara() {
      facingMode = (facingMode === 'user') ? 'environment' : 'user';
      await iniciar();
    }

    // ======== Bucle de dibujo + predicción =========
    async function loop() {
      if (!corriendo) return;
      // dibuja video en canvas de visualización
      ctx.drawImage(video, 0, 0, tamano, tamano);

      // predice (cada ~150ms)
      predecir();

      // anima ~50fps para la vista
      setTimeout(loop, 20);
    }

    function normalizarTensorDesdeCanvas() {
      // Crea tensor 100x100x1 normalizado [0,1] desde el canvas actual
      return tf.tidy(() => {
        const t = tf.browser.fromPixels(canvas)           // [400,400,3]
          .resizeBilinear([inputSize, inputSize])        // [100,100,3]
          .mean(2)                                       // [100,100]
          .toFloat()
          .div(255.0)
          .reshape([1, inputSize, inputSize, 1]);        // [1,100,100,1]
        return t;
      });
    }

    function predecir() {
      if (!modelo) return;
      const x = normalizarTensorDesdeCanvas();
      const out = modelo.predict(x);
      // Soporta salida binaria [sigmoid] o 2 logits/softmax
      let probDog = null, probCat = null, label = '—';

      tf.tidy(() => {
        const data = out.dataSync();
        if (out.shape[out.shape.length-1] === 1) {
          // salida sigmoide: 1 neurona (asumimos >0.5 = Perro)
          probDog = data[0];
          probCat = 1 - probDog;
        } else if (out.shape[out.shape.length-1] === 2) {
          // salida softmax: [perro, gato] o similar: ajusta si tu orden es distinto
          probDog = data[0];
          probCat = data[1];
        }
      });

      if (probDog !== null) {
        label = (probDog >= 0.5) ? 'Perro' : 'Gato';
        actualizarBarras(probDog, probCat);
        document.getElementById('resultado').textContent = label;
      }

      x.dispose();
      if (out.dispose) out.dispose();
    }

    function actualizarBarras(pDog, pCat) {
      const p1 = Math.max(0, Math.min(1, pDog));
      const p2 = Math.max(0, Math.min(1, pCat));
      document.getElementById('prob-dog').textContent = Math.round(p1*100) + '%';
      document.getElementById('prob-cat').textContent = Math.round(p2*100) + '%';
      document.getElementById('bar-dog').style.width = (p1*100) + '%';
      document.getElementById('bar-cat').style.width = (p2*100) + '%';
    }

    // ======== Init ========
    window.addEventListener('load', async () => {
      await cargarModelo(modelSelect.value);
    });
  </script>
</body>
</html>
